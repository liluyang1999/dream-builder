name: Windows Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    name: Verify and bundle unsigned Windows x64 candidate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify and assemble release
        run: pnpm release:build
      - name: Upload checksummed Windows deliverables
        uses: actions/upload-artifact@v7
        with:
          name: dream-builder-windows-x64-unsigned-candidate
          path: output/release/
          if-no-files-found: error
          retention-days: 30
