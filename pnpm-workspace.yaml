packages:
  - apps/*
  - packages/*

allowBuilds:
  '@biomejs/biome': true
  esbuild: true

overrides:
  nanoid: 3.3.18
  postcss: 8.5.23
  source-map-js: 1.2.2
  undici: 8.10.2

# Keep every project dependency storage layer below the workspace root.
storeDir: .pnpm-store
cacheDir: .pnpm-cache
virtualStoreDir: node_modules/.pnpm
enableGlobalVirtualStore: false
